# sentry-micro — zephyr_basic

CONFIG_SENTRY_MICRO=y

# sentry_capture_message() builds the envelope in a 2 KB buffer on the caller's stack
# (SENTRY_MICRO_ENVELOPE_BUFFER_BYTES), and sentry_flush() does the same. The default main
# stack is 1 KB on most boards; 8 KB matches the Arduino loop task this mirrors.
CONFIG_MAIN_STACK_SIZE=8192

# The serial relay shares the console UART with every log line. Minimal mode prints in the
# caller's context instead of from a deferred log thread that flushes whenever it next runs,
# which is what would otherwise land a log line in the middle of a relay request.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Reboot on a fatal error rather than halting, so the next boot can report it. Zephyr halts
# by default, which leaves a field device dead and silent until someone power-cycles it.
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y
