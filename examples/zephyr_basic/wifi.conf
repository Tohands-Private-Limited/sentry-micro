# sentry-micro — zephyr_basic, WiFi build
#
# Merged on top of prj.conf when selected, so the serial-relay build is untouched by any of
# it: the WiFi driver alone adds a 51 KB heap pool, and mbedTLS another 60 KB.
#
#     west build ... -- -DEXTRA_CONF_FILE=wifi.conf
#
# The application owns the network stack; sentry-micro only uses it. Every option here is
# one this sample needs, and the module's Kconfig selects none of them.

# The TLS handshake runs on the caller's thread, here main: mbedTLS's RSA verify and ECDHE
# key exchange go several KB deep, on top of the 2 KB envelope the caller already holds.
# 16 KB is a starting point with margin, not a measured minimum.
CONFIG_MAIN_STACK_SIZE=16384

# IPv4 over the ESP32's own WiFi, with an address from DHCP. The driver selects its L2 and
# the management API but not the IP stack itself.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y

# Rejoin the access point on its own after a drop, instead of staying off the air until the
# next reboot. The transport reports "no route" in the meantime.
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# Packet and buffer counts from Zephyr's own WiFi sample (samples/net/wifi/shell); the
# defaults are sized for small links and run short during a TLS handshake.
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

# BSD-style sockets, which the transport and SNTP are written against, and a DNS resolver
# for the ingest host. The DNS servers come from the DHCP lease.
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# TLS sockets: the stack performs the handshake inside connect() and encrypts every send.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# Ingest negotiates TLS 1.2 with ECDHE-RSA-AES128-GCM-SHA256 behind an RSA certificate
# chain signed with SHA-256, so this one suite, and the SHA-256 it selects, is all that is
# compiled in. Not MBEDTLS_HASH_ALL_ENABLED, as Zephyr's TLS samples use: it drags in MD5 and
# SHA-1, which nothing here needs, and Kconfig warns about MD5 on every build.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# Ingest closes a handshake that does not name the host it wants (SNI): without this every
# send fails before a certificate is even seen.
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

# The bundled root certificate is PEM, and mbedTLS reads only DER without this.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# Incoming records must hold the server's certificate chain in one piece, about 3 KB for
# ingest; the 1500-byte default cannot. Outgoing records only need to carry the request,
# which the transport writes in pieces no larger than this.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=7168
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# mbedTLS allocates its contexts and record buffers from a heap of its own. The default is
# 512 bytes, enough for nothing; 60000 is the figure Zephyr's TLS samples use.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000

# Wall-clock time from the network, so events, logs and metrics carry real timestamps.
CONFIG_SNTP=y
